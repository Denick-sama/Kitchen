<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bucket List — Kitchen</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .emoji-field {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      position: relative;
    }
    #emojiPreview {
      font-size: 1.6rem;
      cursor: pointer;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.65);
      border: 1px solid rgba(249,115,22,0.2);
      border-radius: var(--radius-sm);
      flex-shrink: 0;
      transition: var(--transition);
      user-select: none;
    }
    #emojiPreview:hover { border-color: var(--accent); background: white; }
    #emojiPicker {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      z-index: 60;
      background: rgba(255,247,237,0.97);
      backdrop-filter: var(--blur);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      padding: 0.75rem;
      display: none;
      flex-wrap: wrap;
      gap: 0.3rem;
      width: 240px;
      box-shadow: 0 8px 32px var(--glass-shadow);
    }
    #emojiPicker.open { display: flex; animation: fadeUp 0.2s ease; }
    .emoji-btn {
      font-size: 1.4rem; background: none; border: none; cursor: pointer;
      padding: 0.3rem; border-radius: 6px; transition: var(--transition); line-height: 1;
    }
    .emoji-btn:hover { background: rgba(249,115,22,0.1); transform: scale(1.2); }
    .bucket-list { display: flex; flex-direction: column; gap: 0.7rem; }

    /* Layout */
    .page-layout {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 2rem;
      align-items: start;
    }
    .page-content { min-width: 0; }

    /* Bucket Widget */
    .bucket-widget {
      position: sticky;
      top: 84px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      user-select: none;
    }
    .bucket-widget-label {
      font-size: 0.62rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .bucket-svg-wrap {
      position: relative;
      transition: transform 0.22s cubic-bezier(0.4,0,0.2,1);
    }
    .bucket-svg-wrap:hover { transform: scale(1.05); }
    .bucket-svg-wrap:active { transform: scale(0.97); }

    .bucket-widget-badge {
      position: absolute;
      top: -8px;
      right: -8px;
      width: 26px;
      height: 26px;
      background: var(--accent);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.65rem;
      font-weight: 600;
      color: white;
      box-shadow: 0 2px 8px rgba(249,115,22,0.45);
      font-family: 'DM Mono', monospace;
      border: 2px solid white;
    }
    .bucket-widget-badge.bump { animation: badgeBump 0.3s ease; }
    @keyframes badgeBump {
      0% { transform: scale(1); } 50% { transform: scale(1.4); } 100% { transform: scale(1); }
    }

    /* Drawer */
    .bucket-drawer-overlay {
      position: fixed; inset: 0;
      background: rgba(26,10,0,0.35); backdrop-filter: blur(4px);
      z-index: 150; opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
    }
    .bucket-drawer-overlay.open { opacity: 1; pointer-events: all; }
    .bucket-drawer {
      position: fixed; top: 0; right: 0; bottom: 0;
      width: min(420px, 100vw);
      background: rgba(255,247,237,0.97); backdrop-filter: blur(20px);
      border-left: 1px solid var(--glass-border);
      box-shadow: -12px 0 48px rgba(194,65,12,0.15);
      z-index: 151; display: flex; flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
    }
    .bucket-drawer.open { transform: translateX(0); }
    .bucket-drawer-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--glass-border);
      background: rgba(255,255,255,0.4); flex-shrink: 0;
    }
    .bucket-drawer-header h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.4rem; font-weight: 600; color: var(--orange-800);
    }
    .bucket-drawer-body {
      flex: 1; overflow-y: auto; padding: 1.25rem 1.5rem;
      display: flex; flex-direction: column; gap: 0.7rem;
    }
    .drawer-bucket-item {
      background: var(--surface); border: 1px solid var(--glass-border);
      border-radius: var(--radius-md); padding: 0.9rem 1rem;
      display: flex; align-items: flex-start; gap: 0.75rem;
      animation: fadeUp 0.3s ease both;
    }
    .drawer-bucket-item.achieved { opacity: 0.55; }
    .drawer-bucket-item.achieved .item-name { text-decoration: line-through; }
    .drawer-bucket-icon { font-size: 1.4rem; flex-shrink: 0; }
    .drawer-bucket-info { flex: 1; }
    .drawer-bucket-info .item-name { font-size: 0.85rem; font-weight: 500; margin-bottom: 0.4rem; }
    .drawer-bucket-info .item-meta { display: flex; flex-wrap: wrap; gap: 0.35rem; }
    .drawer-empty {
      text-align: center; padding: 3rem 1rem;
      color: var(--text-muted); font-size: 0.78rem; letter-spacing: 0.04em;
    }
    .drawer-empty .empty-icon { font-size: 2.5rem; opacity: 0.4; margin-bottom: 0.75rem; }

    @media (max-width: 700px) {
      .page-layout { grid-template-columns: 1fr; }
      .bucket-widget {
        position: fixed; bottom: 1.5rem; right: 1.5rem; top: auto; z-index: 90;
        background: rgba(255,247,237,0.9); padding: 0.6rem; border-radius: 50%;
        box-shadow: 0 4px 20px rgba(194,65,12,0.2); border: 1px solid var(--glass-border);
      }
      .bucket-widget-label { display: none; }
    }
  </style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-brand">
    <span class="brand-icon">🍊</span> Kitchen
  </a>
  <ul class="nav-links">
    <li><a href="index.html">🏠 Home</a></li>
    <li><a href="fridge.html">🧊 Fridge</a></li>
    <li><a href="pantry.html">🫙 Pantry</a></li>
    <li><a href="grocery.html">🛒 Grocery</a></li>
    <li><a href="bucket.html">✨ Bucket</a></li>
  </ul>
  <button class="nav-hamburger" id="navHamburger" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>
</nav>

<main>
  <div class="page-layout">
    <div class="page-content">
      <div class="page-header">
        <h1>✨ <span>Bucket List</span></h1>
        <p>Dream ingredients, dishes, cuisines and cooking goals</p>
      </div>

      <div class="stats-bar">
        <div class="stat-chip">Total dreams: <strong id="totalCount">0</strong></div>
        <div class="stat-chip">Achieved: <strong id="achievedCount">0</strong></div>
        <div class="stat-chip">Still dreaming: <strong id="dreamCount">0</strong></div>
      </div>

      <div class="glass-card" style="margin-bottom:1.5rem;">
        <div class="add-form">
          <h2 id="formTitle">Add to Bucket List</h2>
          <form id="addForm" autocomplete="off">
            <div class="form-row">
              <div class="form-group" style="grid-column:1/-1">
                <label for="iName">Name *</label>
                <input type="text" id="iName" placeholder="e.g. Wagyu beef, Homemade miso, Ottolenghi's shakshuka…" required>
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label for="iCategory">Category</label>
                <select id="iCategory"></select>
              </div>
              <div class="form-group">
                <label>Emoji</label>
                <div class="emoji-field">
                  <div id="emojiPreview" title="Click to pick emoji">✨</div>
                  <input type="text" id="iEmoji" placeholder="or type emoji" maxlength="4" style="flex:1;">
                  <div id="emojiPicker"></div>
                </div>
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label for="iCost">Cost Price</label>
                <input type="number" id="iCost" placeholder="0.00" min="0" step="0.01">
              </div>
              <div class="form-group">
                <label for="iNote">Note / Why you want it</label>
                <input type="text" id="iNote" placeholder="Saw it in a cookbook, want to try with family…">
              </div>
            </div>
            <div style="display:flex;gap:0.75rem;margin-top:0.25rem;">
              <button type="submit" class="btn btn-primary" id="submitBtn">+ Add Dream</button>
              <button type="button" class="btn btn-outline" onclick="cancelEdit()">Cancel</button>
            </div>
          </form>
        </div>
      </div>

      <div class="glass-card">
        <div class="filter-bar">
          <input type="text" id="searchInput" placeholder="Search bucket list…">
          <select id="categoryFilter"></select>
          <button class="btn btn-ghost btn-sm" id="toggleAchieved" style="white-space:nowrap;">Hide achieved</button>
          <button class="btn btn-ghost btn-sm" id="clearAllBtn" style="margin-left:auto;">Clear All</button>
        </div>
        <div class="items-container">
          <div class="section-title">
            Dreams
            <span class="count-badge" id="itemCountBadge">0</span>
          </div>
          <div class="bucket-list" id="itemsGrid"></div>
        </div>
      </div>
    </div>

    <!-- SVG Bucket Widget -->
    <div class="bucket-widget" id="bucketWidget" title="View bucket list">
      <div class="bucket-svg-wrap">
        <svg width="90" height="130" viewBox="0 0 90 130" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Handle arc -->
          <path d="M28 22 Q45 6 62 22" stroke="rgba(249,115,22,0.5)" stroke-width="3" fill="none" stroke-linecap="round"/>
          <!-- Handle attachment dots -->
          <circle cx="28" cy="22" r="4" fill="rgba(253,186,116,0.6)" stroke="rgba(249,115,22,0.4)" stroke-width="1.5"/>
          <circle cx="62" cy="22" r="4" fill="rgba(253,186,116,0.6)" stroke="rgba(249,115,22,0.4)" stroke-width="1.5"/>
          <!-- Bucket body (trapezoid) -->
          <path d="M22 28 L12 110 Q12 118 20 118 L70 118 Q78 118 78 110 L68 28 Z" fill="rgba(255,247,237,0.92)" stroke="rgba(249,115,22,0.35)" stroke-width="1.5"/>
          <!-- Rim at top -->
          <rect x="20" y="26" width="50" height="6" rx="3" fill="rgba(253,186,116,0.4)" stroke="rgba(249,115,22,0.3)" stroke-width="1"/>
          <!-- Horizontal band lines on bucket -->
          <path d="M19 55 L71 55" stroke="rgba(249,115,22,0.18)" stroke-width="1" stroke-dasharray="4 3"/>
          <path d="M17 78 L73 78" stroke="rgba(249,115,22,0.18)" stroke-width="1" stroke-dasharray="4 3"/>
          <path d="M15 100 L75 100" stroke="rgba(249,115,22,0.18)" stroke-width="1" stroke-dasharray="4 3"/>
          <!-- Star sparkles inside bucket -->
          <text x="45" y="70" text-anchor="middle" font-size="16" fill="rgba(249,115,22,0.35)">✨</text>
          <text x="30" y="55" text-anchor="middle" font-size="8" fill="rgba(249,115,22,0.25)">★</text>
          <text x="60" y="58" text-anchor="middle" font-size="6" fill="rgba(249,115,22,0.2)">★</text>
        </svg>
        <div class="bucket-widget-badge" id="bucketWidgetBadge">0</div>
      </div>
      <span class="bucket-widget-label">Tap to view</span>
    </div>
  </div>
</main>

<!-- Bucket Drawer -->
<div class="bucket-drawer-overlay" id="drawerOverlay"></div>
<div class="bucket-drawer" id="bucketDrawer">
  <div class="bucket-drawer-header">
    <h2>✨ Bucket List</h2>
    <button class="btn btn-ghost btn-sm" id="closeDrawer" style="font-size:1rem;">✕</button>
  </div>
  <div class="bucket-drawer-body" id="drawerBody">
    <div class="drawer-empty"><div class="empty-icon">✨</div><p>Your bucket list is empty.</p></div>
  </div>
</div>

<script src="js/app.js"></script>
<script src="js/bucket.js"></script>
</body>
</html>
